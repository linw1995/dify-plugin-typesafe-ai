[project]
name = "dify-typesafe"
version = "0.1.1"
description = "TypeSafe AI evaluation tools for Dify"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dify-plugin>=0.9.0,<0.10.0",
    "httpx>=0.28,<0.29",
    "pydantic>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
